<!DOCTYPE html>

<html>
<body>

<h3>Relay Control</h3>

<div>
    <h4>Relay 1</h4>
    <button onclick="send('msg1')">Toggle Relay 1</button>
</div>

<div>
    <h4>Relay 2</h4>
    <button onclick="send('msg2')">Toggle Relay 2</button>
</div>

<script>

const ws = new WebSocket("wss://upscontroller.onrender.com");

ws.onopen = () => {
    console.log("Connected to server");
};

ws.onclose = () => {
    console.log("Disconnected");
};

ws.onerror = (e) => {
    console.log("WebSocket error", e);
};

function send(cmd) {
    if (ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
    }
}

</script>

</body>
</html>
